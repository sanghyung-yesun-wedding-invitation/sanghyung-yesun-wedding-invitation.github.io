<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>공유 사진 후보 · 상형과 예선</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#494943;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}main{max-width:1100px;margin:auto;padding:48px 24px 64px}header{margin-bottom:30px}header small{font-size:12px;letter-spacing:3px;color:#a28b7b}h1{font-size:28px;font-weight:500;margin:12px 0}header p{font-size:14px;line-height:1.8;color:#79736d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.candidate{padding:0;border:1px solid #e1d9d1;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;color:inherit;box-shadow:0 4px 16px #493a2c06}.candidate:focus-visible{outline:3px solid #a28b7b;outline-offset:4px}.candidate img,dialog img{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover}.caption{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}.caption strong{font-size:16px;font-weight:500}.caption span{font-size:11px;color:#947764}.hint{margin-top:28px;font-size:13px;line-height:1.8;color:#79736d}dialog{width:min(900px,calc(100% - 24px));padding:0;border:0;border-radius:12px;background:#fff;color:#494943;overflow:hidden}dialog::backdrop{background:#28231fd9}.dialog-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}.dialog-header h2{margin:0;font-size:18px;font-weight:500}.close{width:40px;height:40px;border:0;background:transparent;font-size:27px;color:#796d62;cursor:pointer}.dialog-footer{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-footer button{border:1px solid #ddd1c6;border-radius:5px;background:#f8f6f2;color:#61554b;font:inherit;padding:10px 15px;cursor:pointer}.dialog-footer p{margin:0;font-size:12px;color:#79736d;text-align:center}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:32px 18px}.grid{grid-template-columns:1fr;gap:22px}h1{font-size:24px}.dialog-footer{gap:8px;padding:14px 12px}.dialog-footer button{font-size:12px;padding:10px}.dialog-footer p{font-size:11px}}
</style>
</head>
<body><main><header><small>SANGHYUNG &amp; YESUN</small><h1>공유 사진 후보</h1><p>좌우는 그대로, 위아래 위치만 조금씩 달리한 2:1 사진입니다.<br>사진을 누르면 크게 비교할 수 있어요. 마음에 드는 번호를 알려주세요.</p></header><div class="grid" id="candidates"></div><p class="hint">5번은 현재 청첩장 공유 창과 같은 구도입니다.<br>이 페이지에서 사진을 눌러도 실제 청첩장은 변경되지 않습니다.</p></main>
<dialog aria-labelledby="candidate-title"><div class="dialog-header"><h2 id="candidate-title"></h2><button class="close" aria-label="닫기">×</button></div><img src="assets/share-photo.jpg" alt="선택한 웨딩 사진 후보"><div class="dialog-footer"><button id="previous">← 이전</button><p id="candidate-status" role="status"></p><button id="next">다음 →</button></div></dialog>
<script>
const positions=Array.from({length:12},(_,i)=>i*5);
const grid=document.querySelector('#candidates');
positions.forEach((position,i)=>{const button=document.createElement('button');button.className='candidate';button.setAttribute('aria-label',`${i+1}번 사진 크게 보기`);button.innerHTML=`<img src="assets/share-photo.jpg" alt="${i+1}번 웨딩 사진 후보" style="object-position:50% ${position}%"><div class="caption"><strong>${String(i+1).padStart(2,'0')}번</strong><span>${i===4?'현재 공유 창':''}</span></div>`;button.onclick=()=>show(i);grid.append(button)});
const modal=document.querySelector('dialog');let current=0;
function show(index){current=(index+positions.length)%positions.length;modal.querySelector('img').style.objectPosition=`50% ${positions[current]}%`;document.querySelector('#candidate-title').textContent=`${String(current+1).padStart(2,'0')}번${current===4?' · 현재 공유 창':''}`;document.querySelector('#candidate-status').textContent=`${current+1} / ${positions.length}`;if(!modal.open){modal.showModal();document.body.style.overflow='hidden'}}
modal.querySelector('.close').onclick=()=>modal.close();modal.addEventListener('close',()=>document.body.style.overflow='');modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});document.querySelector('#previous').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);modal.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}});
</script></body></html>
