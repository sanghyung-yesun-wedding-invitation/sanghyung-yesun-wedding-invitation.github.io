<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>갤러리 사진 자르기</title><link rel="stylesheet" href="gallery-crop.css"></head>
<body><main><header><small>SANGHYUNG &amp; YESUN</small><h1>갤러리 사진 자르기</h1><p>사진 위를 드래그해 남길 영역을 선택하세요.<br>좌표를 복사해서 보내주시면 청첩장에 반영하겠습니다.</p></header><nav aria-label="사진 선택"><button data-photo="0" aria-pressed="true">사진 1</button><button data-photo="1" aria-pressed="false">사진 2</button><button data-photo="2" aria-pressed="false">사진 3</button></nav><div class="workspace"><section class="editor"><div class="image-label"><h2 id="photo-title">사진 1</h2><span id="dimensions"></span></div><canvas id="editor" aria-label="사진에서 잘라낼 영역 선택. 아래 숫자 입력으로도 조절할 수 있습니다."></canvas><p class="tip">좌표는 왼쪽 위가 시작점이며, 원본 사진의 픽셀 기준입니다.</p></section><aside><h2>잘라낸 모습</h2><div class="preview-wrap"><canvas id="preview" aria-label="선택한 영역 미리보기"></canvas></div><form id="coordinates"><label>x · 왼쪽<input name="x" type="number" min="0" step="1" required></label><label>y · 위쪽<input name="y" type="number" min="0" step="1" required></label><label>z · 너비<input name="z" type="number" min="1" step="1" required></label><label>w · 높이<input name="w" type="number" min="1" step="1" required></label><button type="submit">좌표 적용</button></form><div class="actions"><button id="reset">현재 사진 초기화</button><button id="copy">현재 좌표 복사</button><button id="copy-all">3장 좌표 모두 복사</button></div><textarea id="output" readonly aria-label="전달할 자르기 좌표"></textarea><p id="status" role="status" aria-live="polite"></p><p class="tip">이 도구에서 선택해도 실제 청첩장은 바로 변경되지 않습니다. 사진별 선택 영역은 이 브라우저에 저장됩니다.</p></aside></div></main><script src="gallery-crop.js" defer></script></body></html>
